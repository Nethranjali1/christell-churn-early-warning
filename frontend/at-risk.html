<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>At-Risk Patients · Christell Wellness</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/retention.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>
  <main class="main">
    <header class="topbar" id="topbarMount"></header>
    <div class="content">
      <div class="risk-summary" id="riskSummary"></div>
      <div class="tier-filters" id="tierFilters">
        <button class="btn btn-ghost btn-sm on" data-tier="all">All</button>
        <button class="btn btn-ghost btn-sm" data-tier="high">High</button>
        <button class="btn btn-ghost btn-sm" data-tier="medium">Medium</button>
        <button class="btn btn-ghost btn-sm" data-tier="low">Low</button>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">Re-score</button>
        <span class="risk-status" id="riskStatus"></span>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="data-table at-risk-table">
            <thead><tr>
              <th>Patient</th><th>Risk</th><th>Probability</th><th>Inactive in</th><th>Last visit</th><th>Suggested action</th><th>Outreach</th>
            </tr></thead>
            <tbody id="riskBody"><tr><td colspan="7"><div class="skeleton" style="height:18px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="insight-note" id="skippedNote"></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/retention.js"></script>
<script src="assets/js/at-risk.js"></script>
</body>
</html>
