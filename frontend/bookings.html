<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookings · Christell Wellness</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/bookings.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main">
    <header class="topbar" id="topbarMount"></header>

    <div class="content">
      <div class="update-notice" id="updateNotice" hidden>
        <span id="updateNoticeText"></span>
        <button class="btn btn-ghost btn-sm" id="needsUpdateBtn">Show them</button>
      </div>

      <div class="filters-bar">
        <div class="field grow">
          <label for="searchInput">Search</label>
          <div class="input-icon-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" id="searchInput" placeholder="Patient name or mobile" />
          </div>
        </div>
        <div class="field">
          <label for="statusSelect">Status</label>
          <select id="statusSelect">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="field">
          <label for="dateFrom">From</label>
          <input type="date" id="dateFrom" />
        </div>
        <div class="field">
          <label for="dateTo">To</label>
          <input type="date" id="dateTo" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-ghost btn-sm" id="clearFiltersBtn">Clear filters</button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Patient</th>
                <th>Mobile</th>
                <th>Appointment</th>
                <th>Booked on</th>
                <th>Treatments</th>
                <th>Booking spend</th>
                <th>Status</th>
                <th>Record outcome</th>
              </tr>
            </thead>
            <tbody id="bookingsBody">
              <tr><td colspan="8"><div class="skeleton" style="height:18px;"></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" style="padding: 16px 22px;">
          <span id="paginationInfo">—</span>
          <div class="pager-btns">
            <button class="btn btn-ghost btn-sm" id="prevPageBtn">← Prev</button>
            <button class="btn btn-ghost btn-sm" id="nextPageBtn">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/bookings.js"></script>
</body>
</html>
